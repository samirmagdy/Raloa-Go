  /api/v1/public/scheduling/{handle}/availability:
    get:
      operationId: get_get_api_v1_public_scheduling_handle_availability
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Server-calculated available slots
        '400':
          description: Invalid date range or service request
        '404':
          description: Service is unavailable
        '503':
          description: Scheduling backend is not configured
