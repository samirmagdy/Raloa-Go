apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: RALOA_BACKGROUND_WORKER_SERVICE
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '20'
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: RALOA_WORKER_SERVICE_ACCOUNT
      containerConcurrency: 1
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/raloa/raloa:RELEASE_ID
          command: ["node_modules/.bin/tsx"]
          args: ["worker.ts"]
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_ROLE
              value: background-worker
            - name: NODE_ENV
              value: production
            - name: RELEASE_ID
              value: __RELEASE_ID__
            - name: APP_URL
              value: __APP_URL__
            - name: APP_ENV
              value: DEPLOY_ENVIRONMENT
            - name: POSTGRES_ENVIRONMENT
              value: DEPLOY_ENVIRONMENT
            - name: POSTGRES_ENABLED
              value: 'true'
            - name: POSTGRES_SSL
              value: 'true'
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: FIRESTORE_DATABASE_ID
              value: FIRESTORE_DATABASE_ID
            - name: FIREBASE_STORAGE_BUCKET
              value: STORAGE_BUCKET
            - name: FIREBASE_ADMIN_ENABLED
              value: 'true'
            - name: SECRET_MANAGER_ENABLED
              value: 'true'
            - name: SECRET_MANAGER_PROJECT_ID
              value: PROJECT_ID
            - name: INTEGRATION_KMS_KEY_NAME
              value: KMS_KEY_RESOURCE
            - name: STRIPE_PRICE_PRO_MONTHLY
              value: STRIPE_PRICE_PRO_MONTHLY
            - name: STRIPE_PRICE_PRO_YEARLY
              value: STRIPE_PRICE_PRO_YEARLY
            - name: STRIPE_PRICE_STUDIO_MONTHLY
              value: STRIPE_PRICE_STUDIO_MONTHLY
            - name: STRIPE_PRICE_STUDIO_YEARLY
              value: STRIPE_PRICE_STUDIO_YEARLY
            - name: CLOUDFLARE_ZONE_ID
              value: __CLOUDFLARE_ZONE_ID__
            - name: MEDIA_R2_AUTHORITATIVE
              value: MEDIA_R2_AUTHORITY
            - name: CLOUDFLARE_R2_ACCOUNT_ID
              value: __CLOUDFLARE_R2_ACCOUNT_ID__
            - name: CLOUDFLARE_R2_BUCKET
              value: __CLOUDFLARE_R2_BUCKET__
            - name: CLOUDFLARE_R2_PUBLIC_BASE_URL
              value: __CLOUDFLARE_R2_PUBLIC_BASE_URL__
            - name: CLOUD_TASKS_PROJECT_ID
              value: __TASKS_PROJECT__
            - name: CLOUD_TASKS_LOCATION
              value: __TASKS_LOCATION__
            - name: CLOUD_TASKS_QUEUE
              value: __TASKS_QUEUE__
            - name: CLOUD_TASKS_WORKER_URL
              value: __TASKS_WORKER_URL__
            - name: SENTRY_DSN
              value: __SENTRY_DSN__
            - name: TRUSTED_PROXY_HOPS
              value: '1'
            - name: CLOUD_TASKS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: raloa-worker-auth-token
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 5
