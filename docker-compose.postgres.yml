services:
  postgres:
    image: postgres:16-alpine
    container_name: raloa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raloa_dev
      POSTGRES_USER: raloa
      POSTGRES_PASSWORD: raloa_local_only
    ports:
      - "5432:5432"
    volumes:
      - raloa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raloa -d raloa_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raloa_postgres_data:
