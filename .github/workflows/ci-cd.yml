name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  static:
    name: Static and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run check:deployment-topology
      - run: npm run check:persistence-boundary
      - run: npm run check:modular-monolith
      - run: npm run check:adrs
      - run: npm run check:capacity-plan
      - run: npm run check:cost-architecture
      - run: npm run check:migrations
      - run: npm run check:ci-cd
      - run: npm audit --audit-level=high

  tests:
    name: Unit, integration, and contract tests
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: npm run test:http
      - run: npm run test:contracts
      - run: npm run test:feature-flags
      - run: npm run test:strangler-migration
      - run: npm run test:legacy
      - run: npm run test:production-config
      - run: npm run validate:production
        env:
          NODE_ENV: production
          SECRET_MANAGER_ENABLED: "true"
          SECRET_MANAGER_PROJECT_ID: ci-project
          APP_URL: https://raloa.app
          INTEGRATION_KMS_KEY_NAME: projects/ci-project/locations/global/keyRings/ci/cryptoKeys/integrations
          FIREBASE_PROJECT_ID: ci-project
          FIRESTORE_DATABASE_ID: ci-database
          FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
          FIREBASE_ADMIN_ENABLED: "true"
          K_SERVICE: ci
          STRIPE_PRICE_PRO_MONTHLY: price_ci_pro_monthly
          STRIPE_PRICE_PRO_YEARLY: price_ci_pro_yearly
          STRIPE_PRICE_STUDIO_MONTHLY: price_ci_studio_monthly
          STRIPE_PRICE_STUDIO_YEARLY: price_ci_studio_yearly
          CLOUDFLARE_ZONE_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRUSTED_PROXY_HOPS: "1"

  browser:
    name: Playwright browser workflows
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium

  staging:
    name: Staging external-provider gate
    if: github.event_name != 'pull_request'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:integration:staging
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_BEARER_TOKEN: ${{ secrets.STAGING_BEARER_TOKEN }}
          STAGING_SITE_ID: ${{ secrets.STAGING_SITE_ID }}
          STAGING_PUBLIC_HANDLE: ${{ secrets.STAGING_PUBLIC_HANDLE }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_CALENDAR_CASES: ${{ secrets.STAGING_CALENDAR_CASES }}
          STAGING_STRIPE_WEBHOOK_BODY: ${{ secrets.STAGING_STRIPE_WEBHOOK_BODY }}
          STAGING_STRIPE_WEBHOOK_SIGNATURE: ${{ secrets.STAGING_STRIPE_WEBHOOK_SIGNATURE }}
          STAGING_PRODUCT_ID: ${{ secrets.STAGING_PRODUCT_ID }}
          STAGING_DOMAIN_HOSTNAME: ${{ secrets.STAGING_DOMAIN_HOSTNAME }}
          STAGING_DISPOSABLE_DATA_CONFIRMATION: I_UNDERSTAND
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ secrets.STAGING_FIRESTORE_DATABASE_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.STAGING_GOOGLE_APPLICATION_CREDENTIALS }}

  build:
    name: Build immutable release image
    needs: [tests, browser]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        if: github.event_name != 'pull_request'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: github.event_name != 'pull_request'
      - id: meta
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: echo "image=${GCP_REGION:-local}-docker.pkg.dev/${GCP_PROJECT_ID:-local}/raloa/raloa:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build --tag "${{ steps.meta.outputs.image }}" .
      - if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"

  migrate-staging:
    name: Apply staging database migrations
    if: github.event_name != 'pull_request'
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run db:migrate
      - run: npm run db:migrate:verify

  deploy-staging:
    name: Deploy staging
    if: github.event_name != 'pull_request'
    needs: [migrate-staging, build]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Render checked-in service topology
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DEPLOY_REGION: ${{ secrets.GCP_REGION }}
          DEPLOY_RELEASE_ID: ${{ github.sha }}
          DEPLOY_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.RUNTIME_SERVICE_ACCOUNT }}
          DEPLOY_WORKER_SERVICE_ACCOUNT: ${{ secrets.WORKER_SERVICE_ACCOUNT }}
          DEPLOY_FIRESTORE_DATABASE_ID: ${{ secrets.STAGING_FIRESTORE_DATABASE_ID }}
          DEPLOY_STORAGE_BUCKET: ${{ secrets.STAGING_STORAGE_BUCKET }}
          DEPLOY_KMS_KEY_RESOURCE: ${{ secrets.STAGING_KMS_KEY_RESOURCE }}
          DEPLOY_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STAGING_STRIPE_PRICE_PRO_MONTHLY }}
          DEPLOY_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STAGING_STRIPE_PRICE_PRO_YEARLY }}
          DEPLOY_STRIPE_PRICE_STUDIO_MONTHLY: ${{ secrets.STAGING_STRIPE_PRICE_STUDIO_MONTHLY }}
          DEPLOY_STRIPE_PRICE_STUDIO_YEARLY: ${{ secrets.STAGING_STRIPE_PRICE_STUDIO_YEARLY }}
          DEPLOY_CLOUDFLARE_ZONE_ID: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          DEPLOY_WORKER_TASKS_URL: ${{ secrets.STAGING_WORKER_TASKS_URL }}
          DEPLOY_OUTPUT_DIR: .generated-cloud-run
        run: node scripts/render-cloud-run-manifests.mjs
      - run: for file in .generated-cloud-run/*.yaml; do gcloud run services replace "$file" --region "${{ secrets.GCP_REGION }}" --platform managed --quiet; done

  smoke-staging:
    name: Staging smoke gate
    if: github.event_name != 'pull_request'
    needs: [deploy-staging, staging]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run smoke:production
        env:
          PRODUCTION_SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_BEARER_TOKEN: ${{ secrets.STAGING_BEARER_TOKEN }}
          SMOKE_PUBLIC_HANDLE: ${{ secrets.STAGING_PUBLIC_HANDLE }}

  migrate-production:
    name: Apply production database migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run db:migrate
      - run: npm run db:migrate:verify

  production:
    name: Production promotion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [migrate-production, build]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Render checked-in service topology
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DEPLOY_REGION: ${{ secrets.GCP_REGION }}
          DEPLOY_RELEASE_ID: ${{ github.sha }}
          DEPLOY_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.RUNTIME_SERVICE_ACCOUNT }}
          DEPLOY_WORKER_SERVICE_ACCOUNT: ${{ secrets.WORKER_SERVICE_ACCOUNT }}
          DEPLOY_FIRESTORE_DATABASE_ID: ${{ secrets.PRODUCTION_FIRESTORE_DATABASE_ID }}
          DEPLOY_STORAGE_BUCKET: ${{ secrets.PRODUCTION_STORAGE_BUCKET }}
          DEPLOY_KMS_KEY_RESOURCE: ${{ secrets.PRODUCTION_KMS_KEY_RESOURCE }}
          DEPLOY_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.PRODUCTION_STRIPE_PRICE_PRO_MONTHLY }}
          DEPLOY_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.PRODUCTION_STRIPE_PRICE_PRO_YEARLY }}
          DEPLOY_STRIPE_PRICE_STUDIO_MONTHLY: ${{ secrets.PRODUCTION_STRIPE_PRICE_STUDIO_MONTHLY }}
          DEPLOY_STRIPE_PRICE_STUDIO_YEARLY: ${{ secrets.PRODUCTION_STRIPE_PRICE_STUDIO_YEARLY }}
          DEPLOY_CLOUDFLARE_ZONE_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ZONE_ID }}
          DEPLOY_WORKER_TASKS_URL: ${{ secrets.PRODUCTION_WORKER_TASKS_URL }}
          DEPLOY_OUTPUT_DIR: .generated-cloud-run
        run: node scripts/render-cloud-run-manifests.mjs
      - run: for file in .generated-cloud-run/*.yaml; do gcloud run services replace "$file" --region "${{ secrets.GCP_REGION }}" --platform managed --quiet; done

  production-smoke:
    name: Production smoke gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run smoke:release
        env:
          PRODUCTION_SMOKE_BASE_URL: ${{ secrets.PRODUCTION_SMOKE_BASE_URL }}
          SMOKE_BEARER_TOKEN: ${{ secrets.PRODUCTION_SMOKE_BEARER_TOKEN }}
          SMOKE_PUBLIC_HANDLE: ${{ secrets.PRODUCTION_SMOKE_PUBLIC_HANDLE }}
